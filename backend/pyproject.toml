[tool.black]
line-length = 120
target-version = ['py312']
exclude = '''
/(
    migrations
  | .git
  | __pycache__
  | .venv
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["migrations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = "--ignore=migrations"

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
]